name = "utility-engine-edge"
main = "src/index.ts"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

build.command = "npm run build"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "utility-engine-db"
database_id = "9cfed59a-2ebc-4cbb-8dfb-09e6d21a8f0c"
migrations_dir = "src/db/migrations"

[[kv_namespaces]]
binding = "AFFILIATE_KV"
id = "dd082c7e8ed947938a919f1ea3079da8"

[[kv_namespaces]]
binding = "SEO_CACHE_KV"
id = "ff849cb034114190b313b725efb87b6a"
